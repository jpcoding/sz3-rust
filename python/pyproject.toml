[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pysz"
description = "SZ3 error-bounded lossy compression for NumPy arrays (Rust implementation)"
requires-python = ">=3.9"
dependencies = ["numpy"]
dynamic = ["version"]

[tool.maturin]
python-source = "py"
module-name = "pysz._pysz"
