[package]
name = "sz3"
version = "0.1.0"
edition = "2024"

[dependencies]
zstd-safe = { version = "7", features = ["std"] }

[profile.release]
debug = "line-tables-only"

[dev-dependencies]
sha2 = "0.11.0"

[workspace]
members = [".", "capi"]
# built with maturin, against a Python interpreter
exclude = ["python"]
